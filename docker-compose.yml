version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: threadly-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: threadly
    ports:
      - "5432:5432"
    volumes:
      - threadly_pg_data:/var/lib/postgresql/data
volumes:
  threadly_pg_data:
